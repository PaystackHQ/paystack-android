apply plugin: 'com.android.library'
apply plugin: 'jacoco'
apply plugin: 'com.google.devtools.ksp'

def versions = rootProject.ext.versions

jacoco {
    toolVersion = rootProject.ext.jacocoVersion
}

tasks.withType(Test) {
    jacoco.includeNoLocationClasses = true
    jacoco.excludes = ['jdk.internal.*']
}

task jacocoTestReport(type: JacocoReport, dependsOn: ['testDebugUnitTest']) {

    reports {
        xml.required = true
        html.required = true
    }

    def fileFilter = ['**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*', '**/*Test*.*', 'android/**/*.*']
    def debugTree = fileTree(dir: layout.buildDirectory.dir("intermediates/javac/debug/compileDebugJavaWithJavac/classes"), excludes: fileFilter)
    def ktDebugTree = fileTree(dir: layout.buildDirectory.dir("intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes"), excludes: fileFilter)
    def mainSrc = "$project.projectDir/src/main/java"

    sourceDirectories.setFrom(files([mainSrc]))
    classDirectories.setFrom(files([debugTree, ktDebugTree]))
    executionData.setFrom(provider { tasks.named('testDebugUnitTest').get().jacoco.destinationFile })
}

android {
    namespace = 'co.paystack.android'
    compileSdk = rootProject.ext.compileSdkVersion
    lint {
        abortOnError = false
    }
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        minSdk = rootProject.ext.minSdkVersion
        consumerProguardFiles 'proguard-rules.pro'
        aarMetadata {
            minCompileSdk = 29
        }

        buildConfigField 'int', 'VERSION_CODE', "${rootProject.ext.versionCode}"
        buildConfigField 'String', 'VERSION_NAME', "\"${rootProject.ext.versionName}\""
        buildConfigField 'String', 'PUSHER_KEY', "\"${rootProject.getEnvOrDefault("PUSHER_KEY", "")}\""
    }
    buildTypes {
        debug {
            enableUnitTestCoverage = true
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
    testOptions {
        targetSdk = rootProject.ext.targetSdkVersion
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-moshi:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:3.14.9'
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'co.paystack.android.design.widget:pinpad:1.0.8'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$versions.coroutines"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$versions.coroutines"

    implementation "com.squareup.moshi:moshi-kotlin:$versions.moshi"
    ksp "com.squareup.moshi:moshi-kotlin-codegen:$versions.moshi"

    implementation "com.pusher:pusher-java-client:$versions.pusher"

    testImplementation "org.robolectric:robolectric:$versions.robolectric"
    testImplementation "org.mockito:mockito-core:$versions.mockito"
    testImplementation "com.nhaarman.mockitokotlin2:mockito-kotlin:$versions.mockito_kotlin"
    testImplementation "androidx.test.ext:junit-ktx:$versions.junit_ext"
    testImplementation "org.jetbrains.kotlin:kotlin-test-junit:$versions.kotlin"
}

apply from: "https://raw.githubusercontent.com/PaystackHQ/publish-mavencentral/main/maven-publish.gradle"
